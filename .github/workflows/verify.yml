name: Verify saved certificates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: Graph, witnesses, C9 certificate and exact CNF
        run: python3 -B verify.py --budget-seconds 540
      # This lightweight workflow does not download or replay the external LRAT.
      # See VERIFY.md for the full cake_lpr command and its separate receipt.
